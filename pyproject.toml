[project]
name = "src"
version = "0.1.0"
description = ""
authors = [
    {name = "Emil.Kalimulin",email = "m1lkwave-pyth@mail.ru"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi (>=0.162.0,<0.163.0)",
    "uvicorn (>=0.54.0,<0.55.0)",
    "pydantic (>=2.14.2,<3.0.0)",
    "sqlalchemy[asyncio] (>=2.1.6,<3.0.0)",
    "ruff (>=0.17.3,<0.18.0)",
    "mypy (>=2.4.1,<3.0.0)",
    "typing-extensions (>=4.16.0,<5.0.0)",
    "asyncpg (>=0.32.0,<0.33.0)",
    "psycopg-binary (>=3.3.6,<4.0.0)",
    "dotenv (>=0.9.9,<0.10.0)",
    "pydantic-settings (>=2.16.2,<3.0.0)",
    "alembic (>=1.20.1,<2.0.0)",
]

[tool.poetry]
packages = [{include = "src", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
